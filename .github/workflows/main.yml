name: Portal-OS1 Release Validation

on:
  push:
    branches:
      - add-spatial-hud-page
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build all
        run: npm run build

      - name: Worker dry run
        run: npx wrangler deploy --dry-run --config wrangler.toml

      - name: Marketplace dry run
        run: npx wrangler deploy --dry-run --config wrangler.marketplace.toml

  worker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start worker locally
        run: |
          npx wrangler dev --local --port 8787 > worker.log 2>&1 &
          echo $! > worker.pid
          sleep 15

      - name: Validate compatibility routes
        run: |
          for url in \
            /api/bemax/summary \
            /api/bemax/risks \
            /api/bemax/opportunities \
            /api/providers/health \
            /api/providers/models \
            /api/governor/summary \
            /api/governor/approvals \
            /api/governor/risks \
            /api/uss/overview \
            /api/uss/records
          do
            echo "Checking $url"
            curl -fsS -D headers.txt -o body.json "http://127.0.0.1:8787$url"
            grep -q "200" headers.txt
            grep -qi "application/json" headers.txt
          done

      - name: Validate empty registry contracts
        run: |
          for url in \
            /api/identity/registry \
            /api/event/registry \
            /api/relationship/registry \
            /api/research/registry \
            /api/policy/registry \
            /api/provider/registry \
            /api/simulation/registry
          do
            echo "Checking $url"
            curl -fsS "http://127.0.0.1:8787$url" | jq -e '.records == []'
          done

      - name: Stop worker
        if: always()
        run: |
          if [ -f worker.pid ]; then
            kill "$(cat worker.pid)" || true
          fi

  pages-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start Pages app
        run: |
          npm run dev:pages > pages.log 2>&1 &
          echo $! > pages.pid
          sleep 20

      - name: Validate Pages routes
        run: |
          for path in \
            /portal/dashboard \
            /portal/bemax \
            /portal/institute \
            /portal/governor \
            /portal/ecosystem
          do
            echo "Checking $path"
            curl -fsS -I "http://127.0.0.1:5173$path" | grep -q "200"
          done

      - name: Stop Pages app
        if: always()
        run: |
          if [ -f pages.pid ]; then
            kill "$(cat pages.pid)" || true
          fi

  staging-smoke-test:
    name: Live staging smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build-and-test
    # These are repository Actions variables, not secrets. Configure both with
    # the HTTPS origins of already-deployed staging Workers. This job tests the
    # deployed staging services; it intentionally does not deploy from CI.
    if: >-
      ${{
        (github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') &&
        vars.STAGING_WORKER_URL != '' &&
        vars.STAGING_MARKETPLACE_WORKER_URL != ''
      }}
    env:
      STAGING_WORKER_URL: ${{ vars.STAGING_WORKER_URL }}
      STAGING_MARKETPLACE_WORKER_URL: ${{ vars.STAGING_MARKETPLACE_WORKER_URL }}
    steps:
      - name: Validate staging Worker and Marketplace endpoints
        shell: bash
        run: |
          set -euo pipefail

          check_json_status() {
            local url="$1"
            local expected_status="$2"
            local body_file headers_file status
            body_file="$(mktemp)"
            headers_file="$(mktemp)"

            status="$(curl --retry 5 --retry-all-errors --retry-delay 2 \
              --silent --show-error \
              --output "$body_file" --dump-header "$headers_file" \
              --write-out '%{http_code}' "$url")"

            if [[ "$status" != "$expected_status" ]]; then
              echo "Smoke test failed: $url returned HTTP $status; expected $expected_status" >&2
              cat "$body_file" >&2
              return 1
            fi
            if ! grep -qi '^content-type: application/json' "$headers_file"; then
              echo "Smoke test failed: $url did not return JSON" >&2
              cat "$headers_file" >&2
              return 1
            fi
            echo "✓ $url returned HTTP $status with JSON content"
          }

          # /healthz is a read-only runtime wiring check, not a production
          # readiness attestation or external provider reachability probe.
          check_json_status "${STAGING_WORKER_URL%/}/healthz" 200

          # Verify the private provider API rejects anonymous requests. The
          # portal Worker protects this API; /portal/analytics is not a Worker
          # API endpoint and is not used as an authorization assertion.
          check_json_status "${STAGING_WORKER_URL%/}/api/providers/health" 401

          # The deployed Marketplace Worker exposes its public catalog at
          # /api/products (not /api/v1/marketplace/catalog).
          check_json_status "${STAGING_MARKETPLACE_WORKER_URL%/}/api/products" 200
